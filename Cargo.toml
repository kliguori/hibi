[package]
name = "hibi"
version = "0.1.0"
edition = "2024"
description = "Immersion logging tracker"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
anyhow = "1"
skim = "0.10"
chrono = "0.4"
gix = { version = "0.70", default-features = false, features = ["revision", "tree-editor"] }
